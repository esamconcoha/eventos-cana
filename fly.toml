app = "eventos-cana"
primary_region = "ord"

[env]
  # Apaga el logging de cada consulta SQL y de cada parametro, que en local si
  # se quiere. Ver application.properties.
  SQL_LOG_LEVEL = "warn"
  # Origenes que pueden llamar a la API desde un navegador. Se deja localhost
  # para poder apuntar un "ng serve" local contra el backend desplegado. El
  # comodin de vercel.app cubre el dominio de produccion del frontend y los
  # preview, que estrenan URL en cada push; sin el habria que redesplegar el
  # backend cada vez. Ver seguridad/CorsConfig.java.
  CORS_ALLOWED_ORIGINS = "http://localhost:4200,https://eventos-cana.fly.dev,https://*.vercel.app"

[http_service]
  internal_port = 8082
  force_https = true
  auto_start_machines = true
  auto_stop_machines = true
  # En 0, Fly apaga la maquina y el siguiente request tiene que esperar el
  # arranque completo de Spring Boot (~40-60s); el proxy corta antes. En 1
  # siempre queda una viva.
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  # Una sola clave de memoria. Con "memory" y "memory_mb" a la vez gana
  # memory_mb, la maquina queda en 256 MB y el JVM muere por OOM antes de
  # terminar de arrancar.
  memory = "1gb"
