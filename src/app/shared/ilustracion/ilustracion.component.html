<svg class="ilus" viewBox="0 0 140 100" [class.listo]="modo === 'listo'">
  <!-- Halo cálido de fondo: degradado radial que se desvanece (un disco plano
       se veía gris sobre el azul marino del toast). -->
  <defs>
    <radialGradient [attr.id]="idHalo">
      <stop offset="0%" stop-color="#F2B134" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#F2B134" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle class="ilus-halo" cx="70" cy="54" r="42" [attr.fill]="'url(#' + idHalo + ')'" />
  <!-- Sombra en el "piso": se achica cuando el objeto sube -->
  <ellipse class="ilus-sombra" cx="70" cy="93" rx="22" ry="3.5" />

  @switch (escena) {

    <!-- ── Documento: portapapeles con casillas ─────────────────────── -->
    @case ('documento') {
      <g class="ilus-flota">
        <rect x="46" y="22" width="48" height="62" rx="7" class="ilus-madera" />
        <rect x="51" y="30" width="38" height="49" rx="4" class="ilus-papel" />
        <rect x="59" y="16" width="22" height="11" rx="4" class="ilus-ambar" />
        <circle cx="70" cy="20" r="2" class="ilus-madera" />

        <rect x="56" y="38" width="9" height="9" rx="2.5" class="ilus-ambar" />
        <path d="M57.8 42.6 l2.3 2.3 l4-4.6" class="ilus-palomita ilus-palomita--1" />
        <rect x="69" y="40.5" width="15" height="3.5" rx="1.75" class="ilus-linea" />

        <!-- En "listo" también se marca la segunda casilla -->
        <rect x="56" y="52" width="9" height="9" rx="2.5" class="ilus-casilla-2" />
        <path d="M57.8 56.6 l2.3 2.3 l4-4.6" class="ilus-palomita ilus-palomita--2" />
        <rect x="69" y="54.5" width="11" height="3.5" rx="1.75" class="ilus-linea" />
        <rect x="56" y="66" width="28" height="3.5" rx="1.75" class="ilus-linea ilus-linea--tenue" />
      </g>
    }

    <!-- ── Basurero: la tapa se abre y el papel espera (o cae) ──────── -->
    @case ('basurero') {
      <g class="ilus-flota">
        <!-- Papel arrugado -->
        <g class="ilus-bola">
          <circle cx="70" cy="22" r="7.5" class="ilus-papel" />
          <path d="M65.5 20 l3 2.5 l2.5-3 l3.5 3.5 M67 25.5 l3-1.5 l3 1.8" class="ilus-arruga" />
        </g>
        <!-- Cuerpo -->
        <path d="M53 44 H87 L83.2 84 Q82.8 87 79.8 87 H60.2 Q57.2 87 56.8 84 Z" class="ilus-madera" />
        <path d="M62.5 51 V80 M70 51 V80 M77.5 51 V80" class="ilus-costilla" />
        <!-- Tapa: gira sobre la bisagra de la izquierda -->
        <g class="ilus-tapa">
          <rect x="50" y="37" width="40" height="6.5" rx="3.25" class="ilus-ambar" />
          <path d="M64 37 v-2.5 q0-2.5 2.5-2.5 h7 q2.5 0 2.5 2.5 v2.5" class="ilus-asa" />
        </g>
      </g>
    }

    <!-- ── Estado: tarjeta con una línea de avance de tres pasos ────── -->
    @case ('estado') {
      <g class="ilus-flota">
        <rect x="32" y="30" width="76" height="50" rx="8" class="ilus-madera" />
        <rect x="35" y="33" width="70" height="44" rx="5.5" class="ilus-papel" />
        <circle cx="42" cy="39" r="1.6" class="ilus-ambar" />
        <circle cx="47" cy="39" r="1.6" class="ilus-ambar" />
        <circle cx="52" cy="39" r="1.6" class="ilus-ambar" />

        <line x1="46" y1="58" x2="94" y2="58" class="ilus-riel" />
        <line x1="46" y1="58" x2="94" y2="58" class="ilus-progreso" />

        <circle cx="46" cy="58" r="5" class="ilus-nodo" />
        <circle cx="70" cy="58" r="5" class="ilus-nodo" />
        <circle cx="94" cy="58" r="5" class="ilus-nodo-final" />
        <!-- Flecha que empuja hacia el siguiente paso (solo en "pregunta") -->
        <path d="M80 47 l3.5 3.5 l-3.5 3.5" class="ilus-flecha" />

        <rect x="41" y="67" width="10" height="3" rx="1.5" class="ilus-linea" />
        <rect x="65" y="67" width="10" height="3" rx="1.5" class="ilus-linea" />
        <rect x="89" y="67" width="10" height="3" rx="1.5" class="ilus-linea ilus-linea--tenue" />
      </g>
    }
  }

  <!-- Insignia: "?" mientras se pregunta, palomita verde cuando ya se hizo -->
  <g class="ilus-insignia">
    @if (modo === 'pregunta') {
      <circle cx="113" cy="26" r="12" class="ilus-insignia-fondo" />
      <path d="M104.5 33.5 l-6 5 l9-2.2 Z" class="ilus-insignia-fondo" />
      <text x="113" y="31" text-anchor="middle" class="ilus-insignia-texto">?</text>
    } @else {
      <circle cx="113" cy="26" r="12" class="ilus-insignia-ok" />
      <path d="M107.5 26.5 l3.6 3.6 l6.4-7.2" class="ilus-insignia-palomita" />
    }
  </g>

  <!-- Destellos de cuatro puntas -->
  <path class="ilus-destello ilus-destello--1" d="M28 30 l1.6 4.4 l4.4 1.6 l-4.4 1.6 l-1.6 4.4 l-1.6 -4.4 l-4.4 -1.6 l4.4 -1.6 Z" />
  <path class="ilus-destello ilus-destello--2" d="M118 62 l1.1 3 l3 1.1 l-3 1.1 l-1.1 3 l-1.1 -3 l-3 -1.1 l3 -1.1 Z" />
  <path class="ilus-destello ilus-destello--3" d="M36 70 l0.9 2.4 l2.4 0.9 l-2.4 0.9 l-0.9 2.4 l-0.9 -2.4 l-2.4 -0.9 l2.4 -0.9 Z" />
</svg>
