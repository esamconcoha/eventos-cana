@if (visible) {
  <div class="fixed inset-0 z-40 bg-[#021930]/50 backdrop-blur-[2px] animate-backdrop-in"
    (click)="cerrar()">
  </div>

  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 pointer-events-none">
    <div class="pointer-events-auto w-full max-w-3xl h-[85vh] bg-white rounded-[2rem] shadow-2xl overflow-hidden animate-modal-in flex flex-col"
      (click)="$event.stopPropagation()">

      <!-- Encabezado -->
      <div class="flex items-center justify-between gap-2 px-4 sm:px-6 py-4 border-b border-slate-100 bg-gradient-to-r from-amber-50 to-white shrink-0">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-10 h-10 rounded-full bg-amber-400 flex items-center justify-center shadow-glow-amber shrink-0">
            <span class="material-icons text-gray-900 text-[20px]">description</span>
          </div>
          <div class="min-w-0">
            <h3 class="font-serif italic text-xl text-gray-900 truncate">{{ titulo }}</h3>
            <p class="text-xs text-grayMedium truncate">{{ nombreArchivo }}</p>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <!-- En movil el boton queda solo con el icono: con el texto, entre el
               titulo y las dos acciones no cabia nada en el encabezado. -->
          <button (click)="descargar()" class="btn-primary !px-3 sm:!px-4" title="Descargar">
            <span class="material-icons text-[18px]">download</span>
            <span class="hidden sm:inline">Descargar</span>
          </button>
          <button (click)="cerrar()"
            class="w-9 h-9 rounded-full hover:bg-slate-100 flex items-center justify-center text-gray-500 transition-colors">
            <span class="material-icons text-[20px]">close</span>
          </button>
        </div>
      </div>

      <!-- Vista previa -->
      <div class="flex-1 bg-slate-100 min-h-0">
        @if (esPdf && urlSegura) {
          <iframe [src]="urlSegura" class="w-full h-full border-0"></iframe>
        } @else if (esImagen && urlSegura) {
          <div class="w-full h-full overflow-auto flex items-center justify-center p-4">
            <img [src]="urlSegura" [alt]="nombreArchivo" class="max-w-full h-auto rounded-lg shadow-lg">
          </div>
        } @else {
          <div class="w-full h-full flex flex-col items-center justify-center gap-3 text-grayMedium">
            <span class="material-icons text-[48px] text-slate-300">insert_drive_file</span>
            <p class="text-sm">Vista previa no disponible para este tipo de archivo.</p>
            <button (click)="descargar()" class="btn-primary">
              <span class="material-icons text-[18px]">download</span>
              Descargar documento
            </button>
          </div>
        }
      </div>

    </div>
  </div>
}
