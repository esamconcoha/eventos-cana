<div *ngIf="isLoading$ | async" class="fixed inset-0 z-50 flex items-center justify-center bg-[#021930]/60 backdrop-blur-sm">
  <div class="flex flex-col items-center space-y-4 bg-gradient-to-br from-[#04213d] to-[#021930] px-10 py-8 rounded-2xl shadow-glow border border-white/10">
    <!-- Spinner -->
    <div class="relative w-14 h-14">
      <div class="absolute inset-0 rounded-full border-4 border-white/10"></div>
      <div class="absolute inset-0 rounded-full border-4 border-transparent border-t-cyan-400 border-r-cyan-400 animate-spin"></div>
    </div>

    <!-- Texto -->
    <div class="text-white text-sm font-display font-semibold tracking-wide">Cargando...</div>
  </div>
</div>
