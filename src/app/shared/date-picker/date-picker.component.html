<div class="relative">

  <button #disparador type="button" (click)="abrir()" [disabled]="deshabilitado"
    class="w-full flex items-center justify-between border-2 rounded-xl px-3 py-2.5 text-sm text-left bg-white
           transition-colors disabled:bg-slate-50 disabled:text-gray-400 disabled:cursor-not-allowed"
    [class.border-amber-400]="abierto"
    [class.border-slate-200]="!abierto && !invalido"
    [class.border-red-400]="invalido && !abierto">
    <span [class.text-gray-400]="!seleccionada" [class.text-gray-800]="seleccionada">
      {{ texto || placeholder }}
    </span>
    <span class="material-icons text-amber-500 text-[20px]">
      {{ modo === 'fechaHora' ? 'event' : 'calendar_month' }}
    </span>
  </button>

  @if (abierto) {
    <div class="fixed inset-0 z-40" (click)="cerrar()"></div>

    <!-- absolute, no fixed: dentro de un modal/drawer con animacion el ancestro
         tiene transform y pasa a ser el bloque contenedor, con lo que las
         coordenadas de viewport de un fixed dejan de valer. -->
    <div class="absolute z-50 top-full mt-2 left-0 w-[19rem] max-w-[calc(100vw-2rem)]
                bg-white rounded-3xl shadow-2xl border border-slate-100 p-5 animate-fade-in-up"
      (click)="horaAbierta = false; $event.stopPropagation()">

      <!-- Navegación de mes -->
      <div class="flex items-center justify-between mb-4">
        <button type="button" (click)="mesAnterior()"
          class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-gray-500 transition-colors">
          <span class="material-icons text-[18px]">chevron_left</span>
        </button>
        <span class="font-serif italic text-lg text-gray-900">{{ nombreMes }}</span>
        <button type="button" (click)="mesSiguiente()"
          class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-gray-500 transition-colors">
          <span class="material-icons text-[18px]">chevron_right</span>
        </button>
      </div>

      <div class="grid grid-cols-7 mb-1">
        @for (d of nombresDias; track $index) {
          <span class="text-center text-[11px] font-bold uppercase text-slate-400">{{ d }}</span>
        }
      </div>

      <div class="grid grid-cols-7 gap-y-1">
        @for (dia of dias; track $index) {
          <div class="flex items-center justify-center h-9">
            @if (dia) {
              <button type="button" (click)="seleccionarDia(dia)" [disabled]="esBloqueado(dia)"
                class="w-8 h-8 rounded-full text-sm transition-colors"
                [class.bg-amber-400]="esSeleccionado(dia)"
                [class.font-bold]="esSeleccionado(dia) || esHoy(dia)"
                [class.text-gray-900]="esSeleccionado(dia)"
                [class.ring-2]="esHoy(dia) && !esSeleccionado(dia)"
                [class.ring-amber-300]="esHoy(dia) && !esSeleccionado(dia)"
                [class.text-gray-700]="!esSeleccionado(dia) && !esBloqueado(dia)"
                [class.text-gray-300]="esBloqueado(dia)"
                [class.cursor-not-allowed]="esBloqueado(dia)"
                [class.hover:bg-slate-100]="!esSeleccionado(dia) && !esBloqueado(dia)">
                {{ dia.getDate() }}
              </button>
            }
          </div>
        }
      </div>

      <!-- Hora, solo en modo fechaHora -->
      @if (modo === 'fechaHora') {
        <div class="relative mt-3 pt-3 border-t border-slate-100">
          <button type="button" (click)="toggleHora($event)"
            class="w-full flex items-center gap-2 border-2 rounded-lg px-3 py-2 text-sm transition-colors bg-white"
            [class.border-amber-400]="horaAbierta"
            [class.border-slate-200]="!horaAbierta">
            <span class="material-icons text-[18px] text-slate-400">schedule</span>
            <span [class.text-gray-400]="!hora" [class.text-gray-800]="hora">{{ hora || '--:--' }}</span>
          </button>

          @if (horaAbierta) {
            <div class="absolute z-10 top-full mt-1 left-0 flex bg-white rounded-2xl shadow-xl
                        border border-slate-100 overflow-hidden"
              (click)="$event.stopPropagation()">
              <div class="w-16 max-h-48 overflow-y-auto py-1">
                @for (h of horasDisponibles; track h) {
                  <button type="button" (click)="seleccionarHora(h)"
                    class="w-full text-center py-1.5 text-sm font-montserrat transition-colors"
                    [class.bg-amber-400]="horaNum === h"
                    [class.font-bold]="horaNum === h"
                    [class.text-gray-900]="horaNum === h"
                    [class.text-gray-600]="horaNum !== h"
                    [class.hover:bg-slate-50]="horaNum !== h">
                    {{ h < 10 ? '0' + h : h }}
                  </button>
                }
              </div>
              <div class="w-16 max-h-48 overflow-y-auto py-1 border-l border-slate-100">
                @for (m of minutosDisponibles; track m) {
                  <button type="button" (click)="seleccionarMinuto(m)"
                    class="w-full text-center py-1.5 text-sm font-montserrat transition-colors"
                    [class.bg-amber-400]="minutoNum === m"
                    [class.font-bold]="minutoNum === m"
                    [class.text-gray-900]="minutoNum === m"
                    [class.text-gray-600]="minutoNum !== m"
                    [class.hover:bg-slate-50]="minutoNum !== m">
                    {{ m < 10 ? '0' + m : m }}
                  </button>
                }
              </div>
            </div>
          }
        </div>
      }

      <div class="flex justify-between items-center mt-4 pt-3 border-t border-slate-100">
        <button type="button" (click)="limpiar($event)"
          class="text-xs text-gray-400 hover:text-gray-600 transition-colors">Limpiar</button>
        <button type="button" (click)="cerrar()"
          class="text-sm font-medium text-amber-600 hover:text-amber-700 transition-colors">Listo</button>
      </div>
    </div>
  }
</div>
