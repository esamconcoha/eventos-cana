spring.application.name=CANA
server.servlet.context-path=/cana/api
# PORT: la mayoria de plataformas de despliegue (Render, Fly, Cloud Run) inyectan
# esta variable y esperan que la app escuche ahi. En local, sin PORT definida,
# sigue arrancando en 8082 como siempre.
server.port=${PORT:8082}

# Constancia de entrega firmada: se sube como foto de celular y facilmente
# supera el default de Spring Boot (1MB). Ver ConstanciaFirmadaConstants.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Los 4 valores de abajo tienen fallback para que "mvn spring-boot:run" local
# siga funcionando sin configurar nada. En produccion, SIEMPRE fijar DB_URL /
# DB_USERNAME / DB_PASSWORD / JWT_SECRET como variables de entorno reales: si
# se dejan sin definir, la app arranca igual pero usando estos valores por
# defecto, que ya quedaron (o van a quedar) visibles en el repositorio de Git.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.jpa.properties.hibernate.default_schema=CANA
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.connection.useUnicode=true
logging.level.org.hibernate.sql=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace
logging.level.org.hibernate.type.descriptor.sql.BasicExtractor=trace
logger.org.hibernate.SQL.level=debug

application.security.jwt.secret-key=${JWT_SECRET:eventos_cana_floristeria_martita_jwt}
application.security.jwt.expiration=3600
application.security.jwt.refresh-token.expiration=604800

# Origenes permitidos por CORS, separados por coma. Ver seguridad/CorsConfig.java.
# En produccion: la URL real de Vercel (ej. https://eventos-cana.vercel.app).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}