spring.application.name=CANA
server.servlet.context-path=/cana/api
# PORT: la mayoria de plataformas de despliegue (Render, Fly, Cloud Run) inyectan
# esta variable y esperan que la app escuche ahi. En local, sin PORT definida,
# sigue arrancando en 8082 como siempre.
server.port=${PORT:8082}

# Constancia de entrega firmada: se sube como foto de celular y facilmente
# supera el default de Spring Boot (1MB). Ver ConstanciaFirmadaConstants.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Los 4 valores de abajo tienen fallback para que "mvn spring-boot:run" local
# siga funcionando sin configurar nada. En produccion, SIEMPRE fijar DB_URL /
# DB_USERNAME / DB_PASSWORD / JWT_SECRET como variables de entorno reales: si
# se dejan sin definir, la app arranca igual pero usando estos valores por
# defecto, que ya quedaron (o van a quedar) visibles en el repositorio de Git.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.jpa.properties.hibernate.default_schema=CANA
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=none
# show-sql duplica lo que ya imprime el logger org.hibernate.SQL de abajo: con
# los dos activos cada consulta sale dos veces en el log. Se deja solo el logger.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.connection.useUnicode=true

# Logging de SQL, controlado por una sola variable. Sin definirla (local) queda
# como estaba: cada consulta y cada parametro. En produccion se pone en "warn"
# desde el [env] de fly.toml, porque escribir cada query a los logs de Fly es
# caro y no aporta nada.
# Los nombres de logger son los de Hibernate 6: el logger de consultas es
# "org.hibernate.SQL" (mayusculas, el minusculas nunca hizo nada) y el de
# parametros paso de org.hibernate.type.descriptor.sql.BasicBinder a
# org.hibernate.orm.jdbc.bind.
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:debug}
logging.level.org.hibernate.orm.jdbc.bind=${SQL_LOG_LEVEL:trace}

application.security.jwt.secret-key=${JWT_SECRET:eventos_cana_floristeria_martita_jwt}
application.security.jwt.expiration=3600
application.security.jwt.refresh-token.expiration=604800

# Origenes permitidos por CORS, separados por coma. Ver seguridad/CorsConfig.java.
# El default deja andar el "ng serve" local (4200) y el backend desplegado.
# "https://*.vercel.app" cubre de una vez el dominio de produccion del frontend y
# TODOS los deploys de preview, que en Vercel cambian de URL en cada push
# (eventos-cana-e2ofu3ti2-cana3.vercel.app y asi). Sin el comodin habria que
# volver a desplegar el backend cada vez que Vercel genera una URL nueva.
# El mismo valor esta en el [env] de fly.toml, que es el que manda en produccion.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://eventos-cana.fly.dev,https://*.vercel.app}